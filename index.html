<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Drive</title>
<link rel="stylesheet" href="css/style.css">
<script>
  /* 主题：默认浅色。在页面画出来之前就定好，避免闪一下白 */
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('cloud_drive_theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div class="wrap">


  <div class="top">
    <div class="grow">
      <h1><span class="dot"></span>Cloud Drive</h1>
      <div class="sub">文件在这里锁好再上传，别人看到的只是一堆乱码。</div>
    </div>
    <button id="theme" class="themebtn" title="切换浅色/深色">🌗 深色</button>
  </div>

  <!-- 账号与口令模式 -->
  <div class="panel">
    <label>账号</label>
    <div class="acct">
      <div class="who">
        <div class="nick" id="whoNick">未登录</div>
        <div class="src" id="whoSrc">登录后回来就认得你</div>
      </div>
      <button id="recheck">重新识别</button>
      <button id="toLogin">去登录</button>
      <button id="logout" style="display:none">退出</button>
    </div>

    <div style="margin-top:14px">
      <label>钥匙怎么来</label>
      <div class="seg" id="modeSeg">
        <button data-mode="simple" class="on">简单模式</button>
        <button data-mode="pro">专业模式</button>
      </div>
      <div class="hint" id="modeHint"></div>
    </div>

    <!-- 简单模式：口令由账号算出 -->
    <div id="simpleBox" style="margin-top:14px">
      <div class="acct">
        <div class="who"><span class="kid" id="kidText">（准备中）</span></div>
        <button id="refreshKey">换一把钥匙</button>
      </div>
    </div>

    <!-- 专业模式：口令自己定 -->
    <div id="proBox" style="margin-top:14px; display:none">
      <label for="pass">钥匙</label>
      <input id="pass" type="password" placeholder="你自己定，谁都猜不到" autocomplete="new-password">
      <div style="margin-top:12px">
        <label>额外选项</label>
        <label class="cb"><input type="checkbox" id="optZip" checked> 压小一点再存</label>
        <label class="cb"><input type="checkbox" id="optVol"> 切成小块存（每块 8MB）</label>
        <label class="cb"><input type="checkbox" id="optVerify"> 存完检查一下有没有坏</label>
      </div>

      <div style="margin-top:12px" class="row2">
        <button id="btnManifest">导出清单</button>
        <button id="btnVerify">检查全部</button>
        <button id="btnExport">打包下载</button>
      </div>
    </div>

    <div style="margin-top:14px" id="tokenBox">
      <label for="token">通行证</label>
      <div class="row2">
        <div><input id="token" type="password" placeholder="github_pat_..." autocomplete="off"></div>
        <button id="saveToken">存到本机</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <label>上传</label>
    <input id="pick" type="file" multiple>
    <div id="picked" style="margin-top:6px"><span class="dim">还没选文件</span></div>
    <div style="margin-top:10px">
      <button id="upload" class="primary">上传</button>
    </div>
  </div>

  <div class="panel">
    <div class="row2" style="margin-bottom:8px">
      <div><label style="margin:0">存储目录</label></div>
      <button id="refresh">刷新</button>
    </div>
    <div id="list"><div class="dim">点「刷新」载入</div></div>
  </div>

  <div class="panel">
    <label>进度</label>
    <div id="log"></div>
    <details>
      <summary>文件存哪？慢不慢？</summary>
      <p>文件先在这台电脑上锁好，再搬到存东西的地方。搬的过程不用你管。</p>
      <p>钥匙只有你有（登录后）。我们看不到，也没存。</p>
      <p><strong>慢</strong>：上传下载都要等一会儿，通常几十秒。单个文件最大 2GB。</p>
    </details>
  </div>

</div>

<script src="js/config.js"></script>
<script>/* 配了后端就把令牌框收起来，游客不用管它 */addEventListener("DOMContentLoaded",function(){if(window.CloudCfg&&window.CloudCfg.worker){var b=document.getElementById("tokenBox");if(b)b.style.display="none";}});</script>
<script src="js/crypto.js"></script>
<script src="js/auth.js"></script>
<script src="js/identity.js"></script>
<script src="js/api.js"></script>
<script src="js/pro.js"></script>
<script src="js/pageapi.js"></script>
<script src="js/bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
