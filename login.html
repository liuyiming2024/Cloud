<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在跳转登录 · Cloud Drive</title>
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('cloud_drive_theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/theme-plus.css">
<script src="js/theme-plus.js"></script>
</head>
<body>
<div class="wrap" style="max-width:460px">


  <div class="top">
    <div class="grow">
      <h1><span class="dot"></span>正在跳转…</h1>
      <div class="sub">登录由全站统一的登录页负责，那边登完会自动回到这里。</div>
    </div>
  </div>

  <div class="panel">
    <div id="log"></div>
    <div style="margin-top:14px">
      <button id="go" class="primary">现在就去登录</button>
      <a href="index.html" style="margin-left:8px;font-size:13px;color:var(--dim)">直接匿名使用</a>
    </div>
  </div>

  <div class="panel">
    <div class="warn">
      <b>不登录也能用。</b>
      没登录时传上去的东西站长能打开 —— 想保密就登录。
      另外匿名身份只认这台浏览器，清了缓存就找不回来了。
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var box = document.getElementById('log');
  function log(m, k) {
    var d = document.createElement('div');
    d.className = 'log-line' + (k ? ' ' + k : '');
    d.textContent = m;
    box.appendChild(d);
  }
  var btn = document.getElementById('go');
  btn.addEventListener('click', function () {
    window.CloudAuth.goLogin('index.html');
  });

  // 已经登录了就直接回主页，不用绕一圈
  window.CloudAuth.load().then(function (SI) {
    if (SI && SI.ready) {
      return SI.ready.then(function (st) {
        if (st && st.ok) {
          log('已经登录了，正在回去…', 'ok');
          setTimeout(function () { location.href = 'index.html'; }, 400);
        } else {
          log('还没登录，点上面的按钮去登录。');
        }
      });
    }
    log('还没登录，点上面的按钮去登录。');
  });
})();
</script>
</body>
</html>
